# ============================================================
# LLM Proxy — GitLab CI/CD
#
# 브랜치 전략:
#   v0.1.0-rc1  (RC 태그)  → dev 환경 배포
#   v0.1.0      (릴리즈 태그, main 브랜치) → production 배포
# ============================================================

stages:
  - test
  - build
  - deploy

# ── 전역 변수 ─────────────────────────────────────────────────
variables:
  IMAGE_REGISTRY: $CI_REGISTRY_IMAGE        # registry.gitlab.com/<group>/<project>
  GO_VERSION: "1.25"
  CGO_ENABLED: "0"
  GOOS: linux
  GOARCH: amd64

# ── 캐시 템플릿 ───────────────────────────────────────────────
.go_cache: &go_cache
  cache:
    key: go-$CI_COMMIT_REF_SLUG
    paths:
      - .go/pkg/mod/
      - .go/build/
  variables:
    GOPATH: $CI_PROJECT_DIR/.go

# ── 패턴 앵커 ────────────────────────────────────────────────
.tag_rc: &tag_rc
  if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$/'

.tag_release: &tag_release
  if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

# ─────────────────────────────────────────────────────────────
# STAGE: test
# ─────────────────────────────────────────────────────────────

lint:
  stage: test
  image: golangci/golangci-lint:v1.57
  <<: *go_cache
  script:
    - golangci-lint run ./...
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - *tag_rc
    - *tag_release
  allow_failure: true

unit-test:
  stage: test
  image: golang:$GO_VERSION
  <<: *go_cache
  script:
    - go test -race -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out | tail -1
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.out
    expire_in: 1 week
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - *tag_rc
    - *tag_release

build-check:
  stage: test
  image: golang:$GO_VERSION
  <<: *go_cache
  script:
    - go build ./...
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ─────────────────────────────────────────────────────────────
# STAGE: build  (태그가 달린 경우에만 Docker 이미지 빌드)
# ─────────────────────────────────────────────────────────────

.docker_build: &docker_build
  stage: build
  image: docker:26
  services:
    - docker:26-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      docker build \
        --build-arg VERSION="$CI_COMMIT_TAG" \
        --build-arg GIT_COMMIT="$CI_COMMIT_SHORT_SHA" \
        --label "org.opencontainers.image.version=$CI_COMMIT_TAG" \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        -t "$IMAGE_REGISTRY:$CI_COMMIT_TAG" \
        -t "$IMAGE_REGISTRY:latest-dev" \
        .
    - docker push "$IMAGE_REGISTRY:$CI_COMMIT_TAG"
    - docker push "$IMAGE_REGISTRY:latest-dev"

build:rc:
  <<: *docker_build
  after_script:
    # RC는 latest-dev만 갱신 (latest는 갱신 안 함)
    - echo "RC image pushed → $IMAGE_REGISTRY:$CI_COMMIT_TAG"
  rules:
    - *tag_rc

build:release:
  <<: *docker_build
  script:
    - |
      docker build \
        --build-arg VERSION="$CI_COMMIT_TAG" \
        --build-arg GIT_COMMIT="$CI_COMMIT_SHORT_SHA" \
        --label "org.opencontainers.image.version=$CI_COMMIT_TAG" \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        -t "$IMAGE_REGISTRY:$CI_COMMIT_TAG" \
        -t "$IMAGE_REGISTRY:latest" \
        .
    - docker push "$IMAGE_REGISTRY:$CI_COMMIT_TAG"
    - docker push "$IMAGE_REGISTRY:latest"
  rules:
    - *tag_release

# ─────────────────────────────────────────────────────────────
# STAGE: deploy
# ─────────────────────────────────────────────────────────────

# Dev 배포 — RC 태그 (v0.1.0-rc1)
deploy:dev:
  stage: deploy
  image: alpine/kubectl:latest   # kubectl이 있는 이미지로 교체 가능
  environment:
    name: dev
    url: https://dev.llm-proxy.example.com
  variables:
    KUBE_NAMESPACE: llm-proxy-dev   # 환경에 맞게 수정
  before_script:
    - echo "$KUBECONFIG_DEV" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - |
      kubectl set image deployment/llm-proxy \
        llm-proxy="$IMAGE_REGISTRY:$CI_COMMIT_TAG" \
        -n "$KUBE_NAMESPACE"
    - kubectl rollout status deployment/llm-proxy -n "$KUBE_NAMESPACE" --timeout=120s
  after_script:
    - rm -f /tmp/kubeconfig
  rules:
    - *tag_rc
  needs:
    - build:rc

# Production 배포 — Release 태그 (v0.1.0), main 브랜치 커밋에서만
deploy:prod:
  stage: deploy
  image: alpine/kubectl:latest
  environment:
    name: production
    url: https://llm-proxy.example.com
  variables:
    KUBE_NAMESPACE: llm-proxy-prod  # 환경에 맞게 수정
  before_script:
    - echo "$KUBECONFIG_PROD" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - |
      kubectl set image deployment/llm-proxy \
        llm-proxy="$IMAGE_REGISTRY:$CI_COMMIT_TAG" \
        -n "$KUBE_NAMESPACE"
    - kubectl rollout status deployment/llm-proxy -n "$KUBE_NAMESPACE" --timeout=180s
  after_script:
    - rm -f /tmp/kubeconfig
  rules:
    # main 브랜치에서 생성된 릴리즈 태그만 허용
    # 태그 파이프라인에서 $CI_COMMIT_BRANCH는 비어 있을 수 있으므로
    # GitLab 설정으로 "main 브랜치에서만 릴리즈 태그 생성 가능"을 강제하는 것을 권장
    - *tag_release
  needs:
    - build:release
  # 프로덕션은 수동 승인 후 배포 (필요 없으면 이 줄 제거)
  when: manual
