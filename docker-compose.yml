version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # nginx – public entry point (port 80 → llm-proxy:8080)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "10080:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - proxy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # vLLM – OpenAI-compatible local inference server
  # GPU 없는 환경: deploy.resources 블록을 주석 처리하고
  #   --device cpu  옵션을 command에 추가하면 CPU 모드로 기동 가능 (느림)
  # ---------------------------------------------------------------------------
  vllm:
    image: vllm/vllm-openai:latest
    ports:
      - "8000:8000"
    environment:
      # HuggingFace Hub 토큰 (비공개 모델 다운로드 시 필요; 로컬 모델만 쓰면 불필요)
      HUGGING_FACE_HUB_TOKEN: "${HF_TOKEN:-}"
    volumes:
      # 로컬 모델 디렉토리를 /workspace/model 에 고정 마운트
      # 모델 변경 시 VLLM_MODEL_PATH 환경변수만 교체하면 됨
      - ${VLLM_MODEL_PATH:-C:/Users/nhm90/llms/Qwen3.5-4B-AWQ}:/workspace/model:ro
    command:
      - "--model"
      - "/workspace/model"          # 항상 고정 마운트 포인트 사용
      - "--served-model-name"
      - "${VLLM_SERVED_MODEL_NAME:-Qwen3.5-4B-AWQ}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--max-model-len"
      - "${VLLM_MAX_MODEL_LEN:-8192}"
      - "--trust-remote-code"
    # GPU 리소스 예약 (NVIDIA Container Toolkit 필요)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: "8gb"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  proxy:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Routing – vLLM을 기본 업스트림으로 사용
      # OpenAI로 전환: UPSTREAM_BASE_URL=https://api.openai.com + OPENAI_API_KEY 설정
      UPSTREAM_BASE_URL: "${UPSTREAM_BASE_URL:-http://vllm:8000}"
      UPSTREAM_API_KEY: "${UPSTREAM_API_KEY:-${OPENAI_API_KEY:-}}"

      # Auth – map proxy keys to user IDs
      # Example: PROXY_API_KEYS_JSON: '{"sk-proxy-dev":"dev-user"}'
      PROXY_API_KEYS_JSON: ""    # empty = no auth (dev mode)

      # PostgreSQL (dev default; override via .env or environment)
      DATABASE_URL: "${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/llm_proxy?sslmode=disable}"

      # Redis
      REDIS_ADDR: "redis:6379"

      # Quota
      TOKEN_DAILY_LIMIT: "200000"
      TOKEN_SAFETY_FACTOR: "1.20"
      QUOTA_TIMEZONE: "Asia/Seoul"

      # Rate limit
      RATE_LIMIT_RPS: "5"

      # PII
      PII_BLOCK: "false"

      # Observability
      LOKI_PUSH_URL: "http://loki:3100/loki/api/v1/push"
      LOKI_LABELS: "app=llm-proxy,env=dev"

      # Audit
      AUDIT_STREAM_KEY: "audit:llm-proxy"
      AUDIT_RECORD_TTL_SECONDS: "604800"  # 7 days
      AUDIT_STORE_REQUEST_RECORD: "true"
      # AUDIT_HMAC_KEY: "change-me-in-production"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      vllm:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-llm_proxy}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Observability stack: Loki + Prometheus + Alloy + Grafana
  loki:
    image: grafana/loki:2.9.4
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
      - "--storage.tsdb.retention.time=7d"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    ports:
      - "12345:12345"
    volumes:
      - ./config/alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - /etc/alloy/config.alloy
      - "--server.http.listen-addr=0.0.0.0:12345"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.3.3
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki
      - prometheus
      - proxy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
